<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétition en Ligne - Accueil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Bienvenue à la Compétition en Ligne</h1>
    </header>
    <main>
        <section id="selection-thematique">
            <h2>Choisissez une thématique :</h2>
            <ul>
                <li><a href="inscription.html?thematique=Football">Football</a></li>
                <li><a href="inscription.html?thematique=Culture generale">Culture générale</a></li>
                <li><a href="inscription.html?thematique=Musique">Musique</a></li>
                <!-- Ajoutez d'autres thématiques ici -->
            </ul>
        </section>
        <section id="acces-quiz">
            <h2>Accéder à votre Quiz</h2>
            <p>Si vous avez déjà un code d'accès, entrez-le ici :</p>
            <form action="quiz.html" method="GET">
                <label for="code-acces">Code d'accès :</label>
                <input type="text" id="code-acces" name="code" required>
                <button type="submit">Accéder au Quiz</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Compétition en Ligne</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
